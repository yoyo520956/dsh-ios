name: harness
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 20261022.01
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  harness:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.dsh
        PRODUCT_NAME: harness
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: DeepSeek Harness
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/vendor/out"
        OTHER_LDFLAGS: "$(inherited) -lish -lish_emu -lfakefs -larchive"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -lxml2 -liconv -lbz2 -lz"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/vendor/ish/src $(PROJECT_DIR)/vendor/out/include"
        GCC_PRECOMPILE_PREFIX_HEADER: "NO"
        CLANG_ENABLE_MODULES: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Terminal/IshBridge.h
    preBuildScripts:
      - name: Build iSH static libs
        script: ./scripts/build-ish.sh
        inputFiles:
          - scripts/build-ish.sh
        outputFiles:
          - vendor/out/libish.a
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
        UIBackgroundModes: [audio]
schemes:
  harness:
    build:
      targets:
        harness: all
    run:
      config: Debug
    archive:
      config: Release
