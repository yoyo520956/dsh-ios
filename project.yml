name: dsh
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 20261022.02
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    EXPANDED_CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  dsh:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.dsh
        PRODUCT_NAME: dsh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: DeepSeek Harness
        GCC_PRECOMPILE_PREFIX_HEADER: "NO"
        CLANG_ENABLE_MODULES: "YES"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness
        CFBundleShortVersionString: 2.0.0
        CFBundleURLTypes:
          - CFBundleURLName: com.qingyao.dsh
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [dsh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  dsh:
    build:
      targets:
        dsh: all
    run:
      config: Debug
    archive:
      config: Release
