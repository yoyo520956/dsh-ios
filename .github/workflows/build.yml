name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -f dsh.xcodeproj/project.pbxproj
      - name: build archive
        run: |
          set -euo pipefail
          xcodebuild -project dsh.xcodeproj -scheme dsh -configuration Release -archivePath "$PWD/build/dsh.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -30
      - name: export ipa
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/dsh.xcarchive/Products/Applications/dsh.app/Info.plist")
          mkdir -p build/ipa
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>development</string></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "build/dsh.xcarchive" -exportPath build/ipa -exportOptionsPlist build/export.plist CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -allowProvisioningUpdates 2>/dev/null | tail -5
          find build/ipa -name "*.ipa" -exec mv {} "build/dsh-$VERSION-unsigned.ipa" \;
          test -f build/dsh-$VERSION-unsigned.ipa
          ls -la build/dsh-$VERSION-unsigned.ipa
      - name: upload artifact + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=build/dsh-2.0.0-unsigned.ipa
          test -f "$IPA"
          cp "$IPA" build/dsh-unsigned.ipa
          gh release create "v2.0.0" build/dsh-unsigned.ipa --title "dsh-ios v2.0.0 (native)" --notes "DeepSeek Harness iOS 原生移植版：全量功能 + iOS 界面样式" 2>/dev/null || gh release upload v2.0.0 build/dsh-unsigned.ipa --clobber
          gh run download . --name dsh-artifact -D build/ || true
