name: build-rootfs
on:
  push:
    branches: [main]
    paths: ['rootfs/**']
  workflow_dispatch:
    inputs:
      alpine:
        description: 'Alpine image tag'
        default: 'edge'
jobs:
  rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build dsh rootfs in Alpine x64 musl (native, no emulation)
        run: |
          IMG=${{ github.event.inputs.alpine || 'edge' }}
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" "alpine:$IMG" sh -euc '
            set -e
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
            echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
            apk add --no-cache --update nodejs npm libstdc++ ca-certificates bash curl git openssh tzdata build-base python3
            node -v; npm -v
            npm config set allow-scripts=koffi,node-pty,@deepseek-ai/dsh-subprocess-local,@google/genai,protobufjs --location=user
            npm i -g @deepseek-ai/dsh --omit=dev --no-audit --no-fund
            npm cache -g clean --force
            npm cache clean --force 2>/dev/null || true
            echo "--- dsh version ---"
            export PATH="$PATH:/usr/local/bin"
            which dsh || true
            dsh --version || { echo "FATAL: dsh bin 不可用"; exit 1; }
            NM=$(npm root -g)
            echo "--- global modules at $NM (before prune) ---"
            du -sh "$NM"
            echo "--- slimming: drop cross-platform natives / maps / docs / tests ---"
            cd "$NM"
            # 1) 只留 linux-x64 原生二进制（删 darwin/win32/arm64 全平台残留）
            find . -type d \( -name '*-darwin-*' -o -name '*darwin*' -o -name '*-win32-*' -o -name '*win32*' -o -name '*-linux-arm*' -o -name '*-linux-ia32*' \) -prune -exec rm -rf {} + 2>/dev/null || true
            find . -type f \( -name '*.darwin*' -o -name '*.win32*' -o -name '*.exe' -o -name '*.arm64.node' \) -delete 2>/dev/null || true
            # 2) 砍调试与冗余内容
            find . -type f -name '*.map' -delete 2>/dev/null || true
            find . -type f \( -name '*.md' -o -name '*.markdown' \) -delete 2>/dev/null || true
            find . -type d \( -name '.cache' -o -name '__tests__' -o -name 'test' -o -name 'tests' -o -name '.github' -o -name 'docs' -o -name 'example' -o -name 'examples' \) -prune -exec rm -rf {} + 2>/dev/null || true
            find . -type f \( -name '*.ts' -o -name '*.mts' -o -name '*.cts' \) -not -name '*.d.ts' -delete 2>/dev/null || true
            echo "--- global modules (after prune) ---"
            du -sh "$NM"
            cd /
            echo "--- 4th cut: drop .d.ts / fsevents / caches ---"
            find . -name '*.d.ts' -delete 2>/dev/null || true
            find . -type d -name 'fsevents' -prune -exec rm -rf {} + 2>/dev/null || true
            npm cache -g clean --force 2>/dev/null || true
            echo "--- 5th cut: drop heavy native bundles (libreoffice/sherpa/inspector/docpreview) ---"
            rm -rf "$NM"/@deepseek-ai/dsh/node_modules/@deepseek-ai/libreoffice-kit-wasm
            rm -rf "$NM"/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-experimental-inspector
            rm -rf "$NM"/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-client-ui-sidebar-documentpreview
            rm -rf "$NM"/@deepseek-ai/dsh/node_modules/sherpa-onnx-linux-x64
            rm -rf "$NM"/@deepseek-ai/dsh/node_modules/@opentelemetry
            echo "--- after 5th cut ---"
            du -sh "$NM"
            echo "--- top-25 dirs in NM (recursive) ---"
            du -ah "$NM" 2>/dev/null | sort -rh | head -25
            echo "--- file count in NM ---"
            find "$NM" -type f | wc -l
            echo "--- pre-tar du (top level) ---"
            du -sh /usr /etc /var /opt /root /home 2>/dev/null | sort -rh
            tar --exclude=./proc --exclude=./sys --exclude=./dev \
                -czf /out/dsh-rootfs.tgz ./usr ./etc ./lib ./bin ./sbin ./root ./home ./tmp ./var ./opt ./usr/local
          '
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-rootfs
          path: out/dsh-rootfs.tgz
      - name: Publish rootfs tarball
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && mv out/dsh-rootfs.tgz dist/
          VER=$(git rev-parse --short HEAD)
          gh release create rootfs-latest --title "dsh rootfs (auto)" --notes "Alpine x64 musl + node + @deepseek-ai/dsh 预装" 2>/dev/null || true
          gh release upload rootfs-latest dist/dsh-rootfs.tgz --clobber
          gh release view rootfs-latest --json assets -q '.assets[].name'
